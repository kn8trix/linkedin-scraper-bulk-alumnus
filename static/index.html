<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LinkedIn Bulk Scraper</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          brand: { DEFAULT: '#0a66c2', dark: '#004182', light: '#e8f1fb' },
        },
      },
    },
  };
</script>
<style>
  /* Small touches Tailwind's CDN build does not ship by default. */
  .spinner {
    width: 1rem; height: 1rem; border-radius: 9999px;
    border: 2px solid rgba(255,255,255,.35);
    border-top-color: #fff;
    animation: spin .7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .json-view {
    font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
    font-size: 12.5px; line-height: 1.55; tab-size: 2;
  }
  .card-fade { animation: fade .25s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  /* Line-clamp without the plugin. */
  .clamp-3 {
    display: -webkit-box; -webkit-line-clamp: 3;
    -webkit-box-orient: vertical; overflow: hidden;
  }
</style>
</head>
<body class="min-h-screen bg-slate-100 text-slate-800">

  <header class="bg-white border-b border-slate-200">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 py-4 flex items-center gap-3">
      <div class="w-9 h-9 rounded-lg bg-gradient-to-br from-brand to-brand-dark
                  grid place-items-center text-white font-extrabold text-sm">in</div>
      <div>
        <h1 class="text-base font-semibold leading-tight">LinkedIn Bulk Scraper</h1>
        <p class="text-xs text-slate-500 leading-tight">Stateless · images embedded as base64</p>
      </div>
      <div class="flex-1"></div>
      <a href="/docs" class="text-xs text-slate-500 hover:text-brand underline">API docs</a>
      <span id="health" class="text-xs px-2 py-1 rounded-full bg-slate-100 text-slate-500">checking…</span>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 sm:px-6 py-6 space-y-6">

    <!-- ===================== INPUT ===================== -->
    <section class="bg-white rounded-2xl shadow-sm border border-slate-200">
      <div class="px-5 sm:px-6 py-4 border-b border-slate-100 flex items-center gap-2">
        <h2 class="font-semibold">Scrape settings</h2>
        <span class="text-xs text-slate-400">— credentials are used once and never stored</span>
      </div>

      <div class="p-5 sm:p-6 grid gap-5 lg:grid-cols-2">
        <div class="space-y-5">
          <div>
            <label for="cookie" class="block text-sm font-medium mb-1.5">
              LinkedIn session cookie
              <span class="text-slate-400 font-normal">(the whole <code>cookie:</code> header)</span>
            </label>
            <textarea id="cookie" rows="4" spellcheck="false" autocomplete="off"
              placeholder="li_at=...; JSESSIONID=&quot;ajax:...&quot;; bcookie=&quot;...&quot;"
              class="w-full rounded-xl border border-slate-300 bg-slate-50 px-3 py-2 text-sm
                     font-mono resize-y focus:outline-none focus:ring-2 focus:ring-brand
                     focus:border-brand transition"></textarea>
          </div>

          <div>
            <label for="ua" class="block text-sm font-medium mb-1.5">
              User-Agent
              <span class="text-slate-400 font-normal">(must match the cookie's browser)</span>
            </label>
            <input id="ua" type="text" spellcheck="false" autocomplete="off"
              placeholder="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 …"
              class="w-full rounded-xl border border-slate-300 bg-slate-50 px-3 py-2 text-sm
                     font-mono focus:outline-none focus:ring-2 focus:ring-brand
                     focus:border-brand transition">
          </div>
        </div>

        <div class="space-y-5">
          <div>
            <label for="urls" class="block text-sm font-medium mb-1.5">
              Direct profile links
              <span class="text-slate-400 font-normal">(one per line)</span>
            </label>
            <textarea id="urls" rows="5" spellcheck="false" autocomplete="off"
              placeholder="https://www.linkedin.com/in/username&#10;https://www.linkedin.com/in/another"
              class="w-full rounded-xl border border-slate-300 bg-slate-50 px-3 py-2 text-sm
                     font-mono resize-y focus:outline-none focus:ring-2 focus:ring-brand
                     focus:border-brand transition"></textarea>
          </div>

          <div>
            <label for="file" class="block text-sm font-medium mb-1.5">
              Upload CSV / TXT
              <span class="text-slate-400 font-normal">(optional, adds to the links above)</span>
            </label>
            <div class="flex items-center gap-3">
              <input id="file" type="file" accept=".csv,.txt,text/csv,text/plain"
                class="block w-full text-sm text-slate-600 file:mr-3 file:rounded-lg
                       file:border-0 file:bg-brand-light file:px-3 file:py-2
                       file:text-sm file:font-medium file:text-brand hover:file:bg-blue-100
                       cursor-pointer">
            </div>
            <p id="fileName" class="text-xs text-slate-400 mt-1.5"></p>
          </div>
        </div>
      </div>

      <div class="px-5 sm:px-6 pb-5 sm:pb-6 flex flex-wrap items-center gap-3">
        <button id="start"
          class="inline-flex items-center gap-2 rounded-xl bg-brand px-5 py-2.5 text-sm
                 font-semibold text-white shadow-sm hover:bg-brand-dark
                 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-brand
                 disabled:opacity-60 disabled:cursor-not-allowed transition">
          <span id="spinner" class="spinner hidden"></span>
          <span id="startLabel">Start Bulk Scrape</span>
        </button>
        <button id="clearInputs" type="button"
          class="rounded-xl border border-slate-300 px-4 py-2.5 text-sm font-medium
                 text-slate-600 hover:bg-slate-50 transition">
          Clear
        </button>
        <span id="status" class="text-sm text-slate-500"></span>
      </div>
    </section>

    <!-- ===================== ERRORS ===================== -->
    <section id="error" class="hidden bg-white rounded-2xl border border-red-200
                                border-l-4 border-l-red-500 shadow-sm p-5">
      <h3 id="errorTitle" class="font-semibold text-red-600">Something went wrong</h3>
      <p id="errorMessage" class="text-sm text-slate-600 mt-1"></p>
      <p id="errorRemedy" class="text-sm text-slate-600 mt-2 hidden"></p>
    </section>

    <!-- ===================== OUTPUT ===================== -->
    <section id="output" class="hidden bg-white rounded-2xl shadow-sm border border-slate-200">
      <div class="px-5 sm:px-6 py-4 border-b border-slate-100 flex flex-wrap items-center gap-3">
        <div class="flex items-center gap-1 bg-slate-100 rounded-xl p-1">
          <button data-tab="formatted" id="tab-formatted"
            class="tab-btn rounded-lg px-4 py-1.5 text-sm font-medium bg-white shadow-sm text-brand">
            Formatted UI View
          </button>
          <button data-tab="json" id="tab-json"
            class="tab-btn rounded-lg px-4 py-1.5 text-sm font-medium text-slate-600 hover:text-slate-900">
            Raw JSON View
          </button>
        </div>
        <div class="flex-1"></div>
        <span id="summary" class="text-xs text-slate-500"></span>
      </div>

      <!-- Formatted view -->
      <div id="view-formatted" class="p-5 sm:p-6">
        <div id="cards" class="grid gap-5 sm:grid-cols-2 xl:grid-cols-3"></div>
      </div>

      <!-- JSON view -->
      <div id="view-json" class="hidden p-5 sm:p-6 space-y-4">
        <div class="flex flex-wrap gap-2">
          <button id="copyJson"
            class="rounded-lg border border-slate-300 px-3 py-1.5 text-sm font-medium
                   text-slate-600 hover:bg-slate-50 transition">
            Copy to Clipboard
          </button>
          <button id="downloadJson"
            class="rounded-lg border border-slate-300 px-3 py-1.5 text-sm font-medium
                   text-slate-600 hover:bg-slate-50 transition">
            Download JSON File
          </button>
        </div>
        <pre id="jsonOut"
          class="json-view bg-slate-900 text-slate-100 rounded-xl p-4 overflow-auto
                 max-h-[70vh] whitespace-pre"></pre>
      </div>
    </section>

    <footer class="text-center text-xs text-slate-400 pb-6">
      Results live only in this page — refresh or close the tab and they are gone.
    </footer>
  </main>

<script>
(() => {
  'use strict';

  const $ = (id) => document.getElementById(id);
  const els = {
    cookie: $('cookie'), ua: $('ua'), urls: $('urls'), file: $('file'),
    fileName: $('fileName'), start: $('start'), spinner: $('spinner'),
    startLabel: $('startLabel'), status: $('status'), clearInputs: $('clearInputs'),
    error: $('error'), errorTitle: $('errorTitle'), errorMessage: $('errorMessage'),
    errorRemedy: $('errorRemedy'), output: $('output'), cards: $('cards'),
    jsonOut: $('jsonOut'), summary: $('summary'), viewFormatted: $('view-formatted'),
    viewJson: $('view-json'), copyJson: $('copyJson'), downloadJson: $('downloadJson'),
    health: $('health'),
  };

  // State is intentionally in-memory only. Nothing is written to localStorage,
  // so a refresh or a closed tab discards every scraped result.
  let payload = null;
  let activeTab = 'formatted';

  /* ---------------- helpers ---------------- */

  const esc = (s) => String(s ?? '').replace(/[&<>"']/g,
    (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  const initials = (name) => (name || '?').split(/\s+/).filter(Boolean)
    .slice(0, 2).map((w) => w[0]).join('').toUpperCase();

  const text = (v) => (typeof v === 'string' && v.trim()) ? v : null;

  function setStatus(msg, kind) {
    els.status.textContent = msg || '';
    els.status.className = 'text-sm ' + (kind === 'error'
      ? 'text-red-600' : kind === 'ok' ? 'text-emerald-600' : 'text-slate-500');
  }

  function showError(title, message, remedy) {
    els.errorTitle.textContent = title || 'Something went wrong';
    els.errorMessage.textContent = message || '';
    els.errorRemedy.textContent = remedy ? 'Fix: ' + remedy : '';
    els.errorRemedy.classList.toggle('hidden', !remedy);
    els.error.classList.remove('hidden');
  }
  const clearError = () => els.error.classList.add('hidden');

  function setLoading(on) {
    els.start.disabled = on;
    els.spinner.classList.toggle('hidden', !on);
    els.startLabel.textContent = on ? 'Scraping…' : 'Start Bulk Scrape';
  }

  /* ---------------- rendering ---------------- */

  function avatarHtml(item) {
    const src = text(item.profile_picture_base64)
      || text(item.details?.profile_picture?.url);
    if (src) {
      return `<img src="${esc(src)}" alt="" loading="lazy"
                class="w-16 h-16 rounded-full object-cover ring-2 ring-white
                       shadow-sm bg-slate-100 flex-shrink-0">`;
    }
    return `<div class="w-16 h-16 rounded-full grid place-items-center flex-shrink-0
                bg-brand-light text-brand font-bold text-lg ring-2 ring-white shadow-sm">
              ${esc(initials(item.full_name))}</div>`;
  }

  function detailsHtml(item) {
    const d = item.details || {};
    const rows = [];

    const exp = (d.experience || [])[0];
    if (exp) {
      const role = (exp.positions || [])[0] || {};
      rows.push(['Experience', [role.title, exp.company].filter(Boolean).join(' · ')]);
    }
    const edu = (d.education || [])[0];
    if (edu) {
      rows.push(['Education', [edu.degree, edu.field_of_study, edu.school]
        .filter(Boolean).join(', ')]);
    }
    if (d.industry) rows.push(['Industry', d.industry]);
    if ((d.skills || []).length) {
      rows.push(['Skills', d.skills.slice(0, 6).join(', ')
        + (d.skills.length > 6 ? ` +${d.skills.length - 6} more` : '')]);
    }
    const certs = d.certifications || [];
    if (certs.length) rows.push(['Certifications', certs.map((c) => c.name).filter(Boolean).join(', ')]);

    return rows.map(([k, v]) => `
      <div class="flex gap-2 text-sm">
        <span class="w-28 flex-shrink-0 text-slate-400">${esc(k)}</span>
        <span class="text-slate-700 clamp-3">${esc(v)}</span>
      </div>`).join('');
  }

  function cardHtml(item) {
    if (item.success === false) {
      const err = item.error || {};
      return `
        <article class="card-fade rounded-2xl border border-red-200 bg-red-50/40 p-4 flex flex-col gap-2">
          <div class="flex items-start gap-3">
            <div class="w-16 h-16 rounded-full grid place-items-center flex-shrink-0
                        bg-red-100 text-red-500 text-xl">!</div>
            <div class="min-w-0">
              <p class="font-semibold text-slate-800 break-words">${esc(item.profile_url)}</p>
              <p class="text-xs text-red-600 mt-0.5">${esc(err.reason || 'failed')}</p>
            </div>
          </div>
          <p class="text-sm text-slate-600 break-words">${esc(err.message || '')}</p>
          ${err.remedy ? `<p class="text-xs text-slate-500">${esc(err.remedy)}</p>` : ''}
        </article>`;
    }

    const url = text(item.profile_url);
    const details = detailsHtml(item);
    return `
      <article class="card-fade rounded-2xl border border-slate-200 bg-white p-4
                      shadow-sm hover:shadow-md transition flex flex-col gap-3">
        <div class="flex items-start gap-3">
          ${avatarHtml(item)}
          <div class="min-w-0">
            <h3 class="font-semibold text-slate-900 truncate"
                title="${esc(item.full_name || '')}">${esc(item.full_name || 'Unknown')}</h3>
            ${text(item.headline)
              ? `<p class="text-sm text-slate-600 clamp-3 mt-0.5" title="${esc(item.headline)}">${esc(item.headline)}</p>`
              : '<p class="text-sm text-slate-400 mt-0.5">No headline</p>'}
            ${text(item.location)
              ? `<p class="text-xs text-slate-400 mt-1">📍 ${esc(item.location)}</p>`
              : ''}
          </div>
        </div>
        ${details ? `<div class="space-y-1.5 border-t border-slate-100 pt-3">${details}</div>` : ''}
        ${url ? `<a href="${esc(url)}" target="_blank" rel="noopener"
            class="text-xs text-brand hover:underline truncate mt-auto">${esc(url)}</a>` : ''}
      </article>`;
  }

  function render() {
    if (!payload) return;
    const data = payload.data || [];
    const ok = data.filter((d) => d.success !== false).length;
    const failed = data.length - ok;
    els.summary.textContent =
      `${payload.total} processed · ${ok} ok` + (failed ? ` · ${failed} failed` : '');

    els.cards.innerHTML = data.map(cardHtml).join('')
      || '<p class="text-slate-400 text-sm">No results.</p>';
    els.jsonOut.textContent = JSON.stringify(payload, null, 2);
    els.output.classList.remove('hidden');
    switchTab(activeTab);
  }

  function switchTab(tab) {
    activeTab = tab;
    const formatted = tab === 'formatted';
    els.viewFormatted.classList.toggle('hidden', !formatted);
    els.viewJson.classList.toggle('hidden', formatted);
    els.tabFormatted = $('tab-formatted');
    els.tabJson = $('tab-json');
    els.tabFormatted.className = 'tab-btn rounded-lg px-4 py-1.5 text-sm font-medium '
      + (formatted ? 'bg-white shadow-sm text-brand' : 'text-slate-600 hover:text-slate-900');
    els.tabJson.className = 'tab-btn rounded-lg px-4 py-1.5 text-sm font-medium '
      + (!formatted ? 'bg-white shadow-sm text-brand' : 'text-slate-600 hover:text-slate-900');
  }

  /* ---------------- actions ---------------- */

  async function scrape() {
    clearError();
    const cookie = els.cookie.value.trim();
    const ua = els.ua.value.trim();
    const urls = els.urls.value.trim();
    const file = els.file.files[0];

    if (!cookie) { showError('Cookie required', 'Paste the LinkedIn session cookie header.'); return; }
    if (!ua) { showError('User-Agent required', 'Paste the User-Agent from the same browser request.'); return; }
    if (!urls && !file) {
      showError('No profiles', 'Enter at least one profile URL or upload a CSV/TXT file.');
      return;
    }

    const fd = new FormData();
    fd.append('cookie', cookie);
    fd.append('user_agent', ua);
    if (urls) fd.append('profile_urls', urls);
    if (file) fd.append('file', file);

    setLoading(true);
    setStatus('Scraping profiles — this can take a while…');
    try {
      const res = await fetch('/api/bulk-scrape', { method: 'POST', body: fd });
      const body = await res.json().catch(() => null);
      if (!res.ok) {
        const detail = body || {};
        showError(detail.error || `HTTP ${res.status}`,
          detail.message || res.statusText, detail.remedy);
        setStatus('Failed', 'error');
        return;
      }
      payload = body;
      render();
      setStatus(`Done — ${body.total} profile(s) processed.`, 'ok');
    } catch (err) {
      showError('Network error', String(err));
      setStatus('Failed', 'error');
    } finally {
      setLoading(false);
    }
  }

  async function copyJson() {
    if (!payload) return;
    const text = JSON.stringify(payload, null, 2);
    try {
      await navigator.clipboard.writeText(text);
    } catch {
      // Clipboard API needs a secure context; fall back to a temporary node.
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); } catch {}
      ta.remove();
    }
    const original = els.copyJson.textContent;
    els.copyJson.textContent = 'Copied ✓';
    setTimeout(() => { els.copyJson.textContent = original; }, 1300);
  }

  function downloadJson() {
    if (!payload) return;
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `linkedin-bulk-${new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-')}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(a.href);
  }

  function clearAll() {
    ['cookie', 'ua', 'urls'].forEach((k) => { els[k].value = ''; });
    els.file.value = '';
    els.fileName.textContent = '';
    payload = null;
    els.output.classList.add('hidden');
    els.cards.innerHTML = '';
    els.jsonOut.textContent = '';
    clearError();
    setStatus('');
  }

  /* ---------------- wiring ---------------- */

  els.start.addEventListener('click', scrape);
  els.copyJson.addEventListener('click', copyJson);
  els.downloadJson.addEventListener('click', downloadJson);
  els.clearInputs.addEventListener('click', clearAll);
  document.querySelectorAll('.tab-btn').forEach((b) =>
    b.addEventListener('click', () => switchTab(b.dataset.tab)));

  els.file.addEventListener('change', () => {
    const f = els.file.files[0];
    els.fileName.textContent = f ? `Selected: ${f.name} (${(f.size / 1024).toFixed(1)} KB)` : '';
  });

  fetch('/health').then((r) => r.json()).then((h) => {
    const dead = h.session && h.session.error;
    els.health.textContent = dead ? `session ${h.session.error.reason}` : 'service ok';
    els.health.className = 'text-xs px-2 py-1 rounded-full '
      + (dead ? 'bg-amber-100 text-amber-700' : 'bg-emerald-100 text-emerald-700');
  }).catch(() => {
    els.health.textContent = 'offline';
    els.health.className = 'text-xs px-2 py-1 rounded-full bg-slate-200 text-slate-600';
  });
})();
</script>
</body>
</html>
